[project]
name = "screen-translator"
version = "0.1.0"
description = "Real-time screen translation for Windows gaming mode."
requires-python = ">=3.11,<3.13"
dependencies = [
    "deep-translator>=1.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
screen-translator = "screen_translator.app:main"
screen-translator-reading = "screen_translator.reading.pipeline:main"
screen-translator-control = "screen_translator.control_app:main"

[project.optional-dependencies]
desktop = [
    "PyQt6>=6.7",
    "paddleocr>=2.7",
]
windows-ocr = [
    "winrt-Windows.Media.Ocr>=3.2.1; platform_system == 'Windows'",
]
google = [
    "google-cloud-translate>=3.15",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
